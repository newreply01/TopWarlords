<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopWarlords - 全軍 125 名將 2.5D Q 版立繪全覽 (v7.12.0)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #090d16; --card-bg: #111827; --border: #1f2937; --text: #f3f4f6; --muted: #9ca3af; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; padding: 28px 20px 64px; }
  .header { max-width: 1240px; margin: 0 auto 24px; text-align: center; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; background: rgba(56,189,248,.15); color: #38bdf8; border: 1px solid rgba(56,189,248,.35); margin-bottom: 10px; }
  h1 { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
  p.sub { color: var(--muted); font-size: 14px; }
  .section { max-width: 1240px; margin: 28px auto 12px; }
  .section h2 { font-size: 17px; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
  .meta { padding: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .cost { font-family: 'JetBrains Mono', monospace; color: #fbbf24; font-size: 12px; }
  .tag { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <header class="header">
    <div class="badge" id="countBadge">TOP WARLORDS · 125/125 COMPLETED</div>
    <h1>TopWarlords 全軍 125 位名將 Q 版立繪全覽</h1>
    <p class="sub">五大兵團 × 五階費用 ($5~$1) × 384×384 商業級 2.5D 賽璐珞立繪（動態讀取 js/data.js 零死圖）</p>
  </header>
  <main id="galleryRoot"></main>
  <script src="js/historical-audit.js?v=7.15.9"></script>
  <script src="js/data.js?v=7.15.9"></script>
  <script>
    (function () {
      const root = document.getElementById('galleryRoot');
      if (!root || typeof UNITS === 'undefined') return;
      const cats = ['air', 'armor', 'air_defense', 'naval', 'support'];
      cats.forEach(cat => {
        const list = UNITS.filter(u => u.cat === cat).sort((a, b) => b.cost - a.cost);
        const sec = document.createElement('section');
        sec.className = 'section';
        const h2 = document.createElement('h2');
        h2.textContent = `${CATS[cat].label} (${list.length} 位)`;
        sec.appendChild(h2);
        const grid = document.createElement('div');
        grid.className = 'grid';
        list.forEach(u => {
          const card = document.createElement('article');
          card.className = 'card';
          const img = document.createElement('img');
          img.src = u.img;
          img.alt = u.name;
          img.loading = 'lazy';
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.innerHTML = `<div class="row"><span>${u.flag} ${u.name}</span><span class="cost">$${u.cost}</span></div><div class="tag">${u.id} · ${u.tag}</div>`;
          card.appendChild(img);
          card.appendChild(meta);
          grid.appendChild(card);
        });
        sec.appendChild(grid);
        root.appendChild(sec);
      });
    })();
  </script>
</body>
</html>
